services:

  nginx:
    image: nginx
    ports:
      - 8000:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  backend1:
    build: ./backend
    environment:
      - SERVER_NAME="backend1"
    ports:
      - 4001:5000
  
  backend2:
    build: ./backend
    environment:
      - SERVER_NAME="backend2"

    ports:
      - 4002:5000

  backend3:
    build: ./backend
    environment:
      - SERVER_NAME="backend3"
    ports:
      - 4003:5000
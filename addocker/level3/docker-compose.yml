services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - gateway1
      - gateway2
    restart: unless-stopped

  gateway1:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      PORT: 8000
      SERVER_NAME: gateway-1
    depends_on:
      - auth-service
      - product-service
      - order-service
    restart: unless-stopped

  gateway2:
    build: ./backend/gateway
    env_file:
      - ./backend/gateway/.env
    environment:
      PORT: 8000
      SERVER_NAME: gateway-2
    depends_on:
      - auth-service
      - product-service
      - order-service
    restart: unless-stopped

  auth-service:
    build: ./backend/services/auth
    env_file:
      - ./backend/services/auth/.env
    environment:
      PORT: 8001
    restart: unless-stopped

  order-service:
    build: ./backend/services/order
    env_file:
      - ./backend/services/order/.env
    environment:
      PORT: 8002
    restart: unless-stopped

  product-service:
    build: ./backend/services/product
    env_file:
      - ./backend/services/product/.env
    environment:
      PORT: 8003
    restart: unless-stopped

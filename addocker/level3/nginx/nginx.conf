events {}

http {
    upstream gateway_pool {
        # Default strategy: round-robin
        server gateway1:8000 max_fails=2 fail_timeout=5s;
        server gateway2:8000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # React/Vite production build
        root /usr/share/nginx/html;
        index index.html;

        # API paths go through the load balancer.
        location ~ ^/(auth|product|order|gateway)(/|$) {
            proxy_pass http://gateway_pool;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # Everything else serves the frontend.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
